<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KleosFitCoach Pro - Monitor Circuito</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#020303; --panel:#101114; --line:#2a2d33; --text:#f7f8fb; --muted:#9ca3af; --lime:#a6ff00; --danger:#ff4d4d; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,Arial,sans-serif; overflow:hidden; }
    .screen { height:100vh; height:100dvh; display:grid; grid-template-rows:minmax(76px,9vh) minmax(0,1fr) auto; overflow:hidden; }
    header { min-height:0; padding:clamp(12px,1.7vh,22px) clamp(18px,2.2vw,32px); border-bottom:1px solid var(--line); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:clamp(12px,1.6vw,24px); background:#060707; }
    .brand { color:var(--lime); font-weight:1000; letter-spacing:.08em; font-size:clamp(18px,1.65vw,30px); white-space:nowrap; }
    .title { font-size:clamp(20px,1.9vw,34px); font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .status { color:var(--muted); font-weight:800; font-size:clamp(12px,.95vw,18px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .clock { color:var(--lime); font-size:clamp(42px,4.6vw,86px); line-height:.9; font-weight:1000; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:520px; text-align:right; overflow:hidden; }
    .stateBox { display:grid; justify-items:end; gap:2px; }
    .timeInfo { color:var(--muted); font-size:clamp(11px,.8vw,15px); font-weight:900; white-space:nowrap; font-variant-numeric:tabular-nums; }

    main { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,22vw); gap:clamp(14px,1.6vw,26px); padding:clamp(14px,2vh,28px); min-height:0; overflow:hidden; }
    .stage { border:1px solid rgba(166,255,0,.35); border-radius:8px; background:linear-gradient(180deg,#101114,#050606); padding:clamp(18px,2.3vw,38px); display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; min-height:0; overflow:hidden; }
    .kicker { color:var(--lime); font-size:clamp(16px,1.35vw,26px); font-weight:1000; letter-spacing:.08em; text-transform:uppercase; }
    .exercise { font-size:clamp(44px,7.1vw,130px); line-height:.92; font-weight:1000; margin:clamp(8px,1.2vh,18px) 0; word-break:break-word; overflow-wrap:anywhere; max-height:24vh; overflow:hidden; }
    .meta { color:var(--muted); font-size:clamp(18px,1.7vw,32px); font-weight:800; display:flex; gap:18px; flex-wrap:wrap; max-height:7vh; overflow:hidden; }
    .timer { align-self:center; font-size:clamp(96px,17vw,250px); line-height:.82; color:var(--lime); font-weight:1000; text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
    .reps { align-self:center; font-size:clamp(70px,11vw,180px); line-height:.9; color:var(--lime); font-weight:1000; text-align:center; white-space:nowrap; overflow:hidden; }
    .note { font-size:clamp(18px,1.75vw,32px); color:var(--text); font-weight:800; border-top:1px solid var(--line); padding-top:clamp(10px,1.4vh,18px); min-height:0; max-height:11vh; overflow:hidden; }
    .side { display:grid; gap:clamp(10px,1.3vh,16px); grid-template-rows:auto auto minmax(0,1fr); min-height:0; overflow:hidden; }
    .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:clamp(12px,1.4vw,20px); min-height:0; overflow:hidden; }
    .box h3 { margin:0 0 8px; color:var(--lime); font-size:clamp(13px,1vw,18px); text-transform:uppercase; letter-spacing:.08em; }
    .round { font-size:clamp(48px,4.6vw,82px); font-weight:1000; line-height:1; }
    .next { font-size:clamp(22px,2vw,36px); font-weight:900; line-height:1.05; overflow-wrap:anywhere; }
    .queue { overflow:auto; display:grid; gap:10px; padding-right:4px; }
    .station { border:1px solid var(--line); border-radius:8px; padding:clamp(8px,1vh,12px); background:#08090b; }
    .station.active { border-color:var(--lime); background:#132000; }
    .station .name { font-size:clamp(14px,1.05vw,19px); font-weight:900; line-height:1.1; }
    .station .sub { color:var(--muted); font-size:clamp(11px,.8vw,14px); margin-top:4px; }
    footer { min-height:clamp(74px,9vh,122px); padding:clamp(8px,1.2vh,16px) clamp(12px,1.6vw,24px); border-top:1px solid var(--line); display:flex; gap:clamp(7px,.7vw,11px); align-items:center; justify-content:center; align-content:center; flex-wrap:wrap; background:#060707; overflow:visible; }
    button { min-height:clamp(42px,4.8vh,54px); border:0; border-radius:8px; padding:7px clamp(10px,1vw,18px); font-size:clamp(12px,.9vw,16px); font-weight:1000; cursor:pointer; background:var(--lime); color:#071006; min-width:clamp(92px,7vw,134px); white-space:nowrap; }
    button.secondary { background:#101114; color:var(--text); border:1px solid var(--line); }
    button.danger { background:var(--danger); color:#fff; }
    select { min-height:clamp(42px,4.8vh,54px); border:1px solid var(--line); border-radius:8px; background:#101114; color:var(--text); padding:7px 12px; font-size:clamp(12px,.9vw,16px); font-weight:800; min-width:clamp(190px,16vw,300px); max-width:32vw; }
    .recovery .exercise, .recovery .timer, .recovery .reps { color:#ffffff; }
    .recovery .kicker { color:#ffffff; }

    }
    @media (max-width:1000px) {
      body { overflow:auto; }
      .screen { height:auto; min-height:100vh; overflow:visible; }
      header { grid-template-columns:1fr; }
      main { grid-template-columns:1fr; overflow:visible; }
      footer { flex-wrap:wrap; overflow:visible; }
      select { max-width:none; width:100%; }
    }
    @media (orientation: portrait) {
      body { overflow:hidden; }
      .screen {
        width:100vw;
        height:100vh;
        height:100dvh;
        min-height:0;
        overflow:hidden;
        grid-template-rows:96px minmax(0,1fr) auto;
      }
      header {
        grid-template-columns:1fr auto;
        grid-template-areas:"brand state" "title title";

      header > div:nth-child(2) { grid-area:title; min-width:0; }
      .stateBox { grid-area:state; }

      .clock { font-size:42px; min-width:320px; }
      .title { font-size:24px; }
      .status { font-size:14px; }
      main {
        grid-template-columns:1fr;
        grid-template-rows:minmax(0,1fr) minmax(360px,34vh);
        padding:12px;
        gap:10px;
        overflow:hidden;
      }
      .stage {
        min-height:0;
        padding:18px;
        grid-template-rows:auto minmax(0,1fr) auto;
      }
      .kicker { font-size:20px; }
      .exercise {
        font-size:clamp(44px,10vw,96px);
        max-height:20vh;
        margin:10px 0 4px;
      }
      .meta { font-size:clamp(16px,3vw,28px); max-height:5vh; }
      .timer { font-size:clamp(120px,28vw,260px); }
      .reps { font-size:clamp(86px,20vw,200px); }
      .note { font-size:clamp(18px,3.8vw,34px); max-height:8vh; padding-top:10px; }
      .side {
        grid-template-columns:128px minmax(0,1fr);

      .side .box:nth-child(1) { grid-column:1; grid-row:1 / span 2; }
      .side .box:nth-child(2) { grid-column:2; grid-row:1; }

      .box { padding:10px; }
      .box h3 { font-size:12px; margin-bottom:6px; }
      .round { font-size:54px; }
      .next { font-size:22px; }
      .queue {
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
        overflow-y:auto;
        overflow-x:hidden;
        -webkit-overflow-scrolling:touch;
        touch-action:pan-y;
      }
      .queue .station:nth-child(n+5) { display:block; }
      .station { padding:7px; }
      .station .name { font-size:15px; }
      .station .sub { font-size:11px; }
      footer {
        min-height:148px;
        height:auto;
        padding:8px 10px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:8px;
        overflow:visible;
      }
      select {
        grid-column:1 / -1;
        width:100%;
        max-width:none;
        min-width:0;
        min-height:42px;
        height:42px;
        font-size:14px;
      }
      button {
        min-width:0;
        min-height:42px;
        height:42px;
        padding:6px 8px;
        font-size:13px;
      }
    }
  </style>
<style>

#monitorTxtFile::file-selector-button{appearance:none;min-height:clamp(42px,4.8vh,54px);border:0;border-radius:8px;padding:7px clamp(10px,1vw,18px);font-family:inherit;font-size:clamp(12px,.9vw,16px);font-weight:1000;cursor:pointer;background:var(--lime);color:#071006;min-width:clamp(92px,7vw,134px);margin-right:12px}
#monitorTxtFile::file-selector-button:hover{filter:brightness(1.08)}

<body>
  <div class="screen">
    <header>
      <div class="brand">KLEOS FITCOACH PRO</div>
      <div>
        <div id="circuitTitle" class="title">Circuito funzionale</div>
        <div id="circuitDescription" class="status">Caricamento...</div>
      </div>
      <div class="stateBox">
        <div id="realClock" class="clock">--:--</div>
        <div id="stateLabel" class="status">PRONTO</div>
      </div>
    </header>

    <main>
      <section id="stage" class="stage">
        <div>
          <div id="stationType" class="kicker">STAZIONE</div>
          <div id="exerciseName" class="exercise">Seleziona circuito</div>
          <div id="exerciseMeta" class="meta"></div>
        </div>
        <div id="mainValue" class="timer">00:00</div>
        <div id="stationNote" class="note"></div>
      </section>

      <aside class="side">
        <div class="box">
          <h3>Giro</h3>
          <div id="roundLabel" class="round">1/1</div>
        </div>
        <div class="box timeBox">
          <h3>Tempi circuito</h3>
          <div class="timeRows">
            <div><span>TOTALE</span><strong id="totalCircuitTime">00:00</strong></div>
            <div><span>RIMANENTE</span><strong id="remainingCircuitTime">00:00</strong></div>
          </div>
        </div>
        <div class="box">
          <h3>Prossima</h3>
          <div id="nextStation" class="next">-</div>
        </div>
        <div class="box queue" id="queue"></div>
      </aside>
    </main>

    <section id="monitorTxtPane" class="monitorTxtPane" hidden aria-label="Visualizzatore TXT"><div class="monitorTxtTools"><label for="monitorTxtFile">Apri file TXT</label><input id="monitorTxtFile" type="file" accept=".txt,text/plain" onchange="loadMonitorTxt(this)"><button type="button" class="secondary" aria-label="Riduci carattere" onclick="resizeMonitorTxt(-2)">A−</button><button type="button" class="secondary" aria-label="Ingrandisci carattere" onclick="resizeMonitorTxt(2)">A+</button></div><div id="monitorTxtName" class="monitorTxtName"></div><div id="monitorTxtMessage" class="monitorTxtMessage" role="status" aria-live="polite">Scegli un file TXT: il testo si adatta alla larghezza della schermata.</div><pre id="monitorTxtText" class="monitorTxtText" tabindex="0" aria-label="Contenuto file TXT"></pre></section>
<footer>
<button class="secondary" type="button" onclick="window.open('schede-txt.html','_blank','noopener')">CREA SCHEDA TXT</button>
<button id="monitorTxtToggle" type="button" class="secondary" onclick="toggleMonitorTxt()" aria-controls="monitorTxtPane" aria-expanded="false">VISUALIZZA TXT</button>
      
      <select id="circuitSelect" onchange="selectCircuit(this.value)"></select>
      <button onclick="startTimer()">START</button>
      <button class="secondary" onclick="pauseTimer()">PAUSA</button>
      <button class="secondary" onclick="nextStep()">AVANTI</button>
      <button class="danger" onclick="resetCircuit()">RESET</button>
      <button id="voiceButton" class="secondary" onclick="toggleVoice()">VOCE ON</button>
      <button class="secondary" onclick="toggleFullscreen()">SCHERMO INTERO</button>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://dicfqbqdbqkyggjezpaz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_m4WBBkaDzYRfeEQYrCkdGw_LSKwPBB_";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let circuits = [];
    let circuit = null;
    let stations = [];
    let stationIndex = 0;
    let round = 1;
    let phase = "work";
    let remaining = 0;
    let timer = null;
    let running = false;
    let voiceEnabled = true;
    let lastCountdownSpoken = null;
    let preferredVoice = null;
    const audioFiles = {
      start: "assets/audio/via.mp3",
      recovery: "assets/audio/recupero.mp3",
      next: "assets/audio/cambio.mp3",
      last10: "assets/audio/ultimi-10.mp3",
      three: "assets/audio/tre.mp3",
      two: "assets/audio/due.mp3",
      one: "assets/audio/uno.mp3",
      roundEnd: "assets/audio/fine-giro.mp3",
      finish: "assets/audio/fine-circuito.mp3",
    };
    const audioCache = {};

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");
      document.getElementById("realClock").textContent = `${hours}:${minutes}:${seconds}`;
    }

    function pickPreferredVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      const italianVoices = voices.filter((voice) => voice.lang?.toLowerCase().startsWith("it"));
      const femaleHints = ["elsa", "alice", "lucia", "paola", "federica", "google italiano", "microsoft elsa", "female", "woman", "donna"];
      preferredVoice =
        italianVoices.find((voice) => femaleHints.some((hint) => voice.name.toLowerCase().includes(hint))) ||
        italianVoices.find((voice) => voice.localService) ||
        italianVoices[0] ||
        voices.find((voice) => femaleHints.some((hint) => voice.name.toLowerCase().includes(hint))) ||
        voices[0] ||
        null;
      return preferredVoice;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = pickPreferredVoice;
      pickPreferredVoice();
    }

    function speak(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "it-IT";
      utterance.voice = preferredVoice || pickPreferredVoice();
      utterance.rate = 0.88;
      utterance.pitch = 1.12;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function playVoice(key, fallbackText = "") {
      if (!voiceEnabled) return;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      const source = audioFiles[key];
      if (!source) {
        if (fallbackText) speak(fallbackText);
        return;
      }
      const audio = audioCache[key] || new Audio(source);
      audioCache[key] = audio;
      audio.currentTime = 0;
      audio.play().catch(() => {
        if (fallbackText) speak(fallbackText);
      });
    }

    function announceStation() {
      const station = currentStation();
      if (!station || station.station_type === "recovery") return;
      const modeText = station.work_mode === "reps" ? `${station.reps} ripetizioni` : `${station.work_seconds || 0} secondi`;
      speak(`${station.exercise_name}. ${modeText}`);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById("voiceButton").textContent = voiceEnabled ? "VOCE ON" : "VOCE OFF";
      if (voiceEnabled) playVoice("start", "Voce attiva");
      else if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Number(seconds) || 0);
      const min = String(Math.floor(safe / 60)).padStart(2, "0");
      const sec = String(safe % 60).padStart(2, "0");
      return `${min}:${sec}`;
    }

    function stationDuration(station) {
      if (!station) return 0;
      if (station.station_type === "recovery") {
        return Number(station.work_seconds) || 0;
      }
      if (station.work_mode === "reps") {
        const reps = Number(station.reps) || 0;
        const repSeconds = Number(station.rep_seconds) || 0;
        const between = Number(station.seconds_between_reps) || 0;
        return Math.max(0, reps * repSeconds + Math.max(0, reps - 1) * between) +
          (Number(station.recovery_seconds) || 0);
      }
      return (Number(station.work_seconds) || 0) +
        (Number(station.recovery_seconds) || 0);
    }

    function totalCircuitSeconds() {
      if (!circuit || !stations.length) return 0;
      const oneRound = stations.reduce((sum, station) => sum + stationDuration(station), 0);
      const roundRest = Number(circuit.rest_between_rounds_seconds) || 0;
      return oneRound * (Number(circuit.rounds) || 1) +
        roundRest * Math.max(0, (Number(circuit.rounds) || 1) - 1);
    }

    function remainingCircuitSeconds() {
      if (!circuit || !stations.length) return 0;

      const rounds = Number(circuit.rounds) || 1;
      const roundRest = Number(circuit.rest_between_rounds_seconds) || 0;
      let total = 0;

      if (phase === "roundRest") {
        total += Math.max(0, Number(remaining) || 0);
        for (let r = round + 1; r <= rounds; r++) {
          total += stations.reduce((sum, station) => sum + stationDuration(station), 0);
          if (r < rounds) total += roundRest;
        }
        return total;
      }

      const current = currentStation();

      if (phase === "recovery") {
        total += Math.max(0, Number(remaining) || 0);
      } else if (current) {
        if (current.station_type === "recovery") {
          total += Math.max(0, Number(remaining) || 0);
        } else if (current.work_mode === "time") {
          total += Math.max(0, Number(remaining) || 0);
          total += Number(current.recovery_seconds) || 0;
        } else {
          total += Number(current.recovery_seconds) || 0;
        }
      }

      for (let i = stationIndex + 1; i < stations.length; i++) {
        total += stationDuration(stations[i]);
      }

      if (round < rounds) {
        total += roundRest;
        const oneRound = stations.reduce((sum, station) => sum + stationDuration(station), 0);
        total += oneRound * Math.max(0, rounds - round - 1);
        total += roundRest * Math.max(0, rounds - round - 1);
      }

      return Math.max(0, total);
    }

    function renderCircuitTimes() {
      const total = totalCircuitSeconds();
      const remainingTotal = remainingCircuitSeconds();
      const totalEl = document.getElementById("totalCircuitTime");
      const remainingEl = document.getElementById("remainingCircuitTime");
      if (totalEl) totalEl.textContent = formatTime(total);
      if (remainingEl) remainingEl.textContent = formatTime(remainingTotal);
    }

    function currentStation() {
      return stations[stationIndex] || null;
    }

    function nextStationName() {
      if (!stations.length) return "-";
      const s = currentStation();

      // Se siamo in recupero, mostra il vero passaggio successivo.
      if (phase === "recovery" || s?.station_type === "recovery") {
        const next = stations[stationIndex + 1];
        if (next) return next.exercise_name;
        if (round < circuit.rounds) return `Recupero giro ${circuit.rest_between_rounds_seconds}s`;
        return "Fine circuito";
      }

      // Durante l'esercizio, il recupero resta il prossimo passaggio.
      if (phase === "work" && s?.recovery_seconds > 0) {
        return `Recupero ${s.recovery_seconds}s`;
      }

      const next = stations[stationIndex + 1];
      if (next) return next.exercise_name;
      if (round < circuit.rounds) return `Recupero giro ${circuit.rest_between_rounds_seconds}s`;
      return "Fine circuito";
    }

    function render() {
      const s = currentStation();
      const stage = document.getElementById("stage");
      stage.classList.toggle("recovery", s?.station_type === "recovery" || phase === "recovery" || phase === "roundRest");
      document.getElementById("circuitTitle").textContent = circuit?.title || "Circuito funzionale";
      document.getElementById("circuitDescription").textContent = circuit?.description || "";
      document.getElementById("roundLabel").textContent = circuit ? `${round}/${circuit.rounds}` : "1/1";
      document.getElementById("nextStation").textContent = nextStationName();
      document.getElementById("stateLabel").textContent = running ? "LIVE" : "PAUSA";
      renderCircuitTimes();

      if (!s) {
        document.getElementById("stationType").textContent = "PRONTO";
        document.getElementById("exerciseName").textContent = "Nessun circuito";
        document.getElementById("exerciseMeta").textContent = "";
        document.getElementById("mainValue").className = "timer";
        document.getElementById("mainValue").textContent = "00:00";
        document.getElementById("stationNote").textContent = "";
        return;
      }

      if (phase === "recovery") {
        document.getElementById("stationType").textContent = "RECUPERO";
        document.getElementById("exerciseName").textContent = "Recupero";
        document.getElementById("exerciseMeta").textContent = "";
        document.getElementById("mainValue").className = "timer";
        document.getElementById("mainValue").textContent = formatTime(remaining);
        document.getElementById("stationNote").textContent = "Prepara la prossima stazione.";
      } else if (phase === "roundRest") {
        document.getElementById("stationType").textContent = "RECUPERO TRA GIRI";
        document.getElementById("exerciseName").textContent = "Cambio giro";
        document.getElementById("exerciseMeta").textContent = "";
        document.getElementById("mainValue").className = "timer";
        document.getElementById("mainValue").textContent = formatTime(remaining);
        document.getElementById("stationNote").textContent = "Riparti dal primo esercizio.";
      } else {
        const isRecoveryStation = s.station_type === "recovery";
        document.getElementById("stationType").textContent = isRecoveryStation ? "RECUPERO" : `STAZIONE ${stationIndex + 1}`;
        document.getElementById("exerciseName").textContent = s.exercise_name;
        document.getElementById("exerciseMeta").textContent = [s.muscle_group, s.equipment, s.load_text].filter(Boolean).join(" - ");
        document.getElementById("mainValue").className = s.work_mode === "reps" && !isRecoveryStation ? "reps" : "timer";
        document.getElementById("mainValue").textContent = s.work_mode === "reps" && !isRecoveryStation ? `${s.reps} REP` : formatTime(remaining);
        document.getElementById("stationNote").textContent = s.notes || (s.work_mode === "reps" ? "Premi AVANTI quando completato." : "");
      }

      const queue = document.getElementById("queue");
      queue.innerHTML = stations.map((item, index) => `
        <div class="station ${index === stationIndex && phase === "work" ? "active" : ""}">
          <div class="name">${index + 1}. ${item.exercise_name}</div>
          <div class="sub">${item.station_type === "recovery" ? "Recupero" : item.work_mode === "reps" ? `${item.reps} rep` : `${item.work_seconds || 0}s`} ${item.recovery_seconds ? `+ rec ${item.recovery_seconds}s` : ""}</div>
        </div>
      `).join("");

      // Scorre automaticamente l'elenco fino alla stazione corrente.
      const activeStation = queue.querySelector(".station.active");
      if (activeStation) {
        activeStation.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }

    function setInitialTime() {
      const s = currentStation();
      remaining = s?.work_mode === "time" || s?.station_type === "recovery" ? Number(s.work_seconds) || 0 : 0;
    }

    function startTimer() {
      if (!circuit || !stations.length) return;
      if (!currentStation()) return;
      if (remaining <= 0 && currentStation().work_mode === "time") setInitialTime();
      playVoice("start", "Via");
      setTimeout(announceStation, 900);
      running = true;
      clearInterval(timer);
      timer = setInterval(() => {
        const s = currentStation();
        if (!s) return;
        if (phase === "work" && s.work_mode === "reps" && s.station_type !== "recovery") {
          render();
          return;
        }
        remaining -= 1;
        if (remaining === 10 && lastCountdownSpoken !== "10") {
          playVoice("last10", "Ultimi dieci secondi");
          lastCountdownSpoken = "10";
        } else if (remaining > 0 && remaining <= 3 && lastCountdownSpoken !== String(remaining)) {
          playVoice(
            remaining === 3 ? "three" : remaining === 2 ? "two" : "one",
            remaining === 3 ? "Tre" : remaining === 2 ? "Due" : "Uno"
          );
          lastCountdownSpoken = String(remaining);
        }
        if (remaining <= 0) nextStep();
        render();
      }, 1000);
      render();
    }

    function pauseTimer() {
      running = false;
      clearInterval(timer);
      render();
    }

    function nextStep() {
      const s = currentStation();
      if (!s) return;
      if (phase === "work" && s.station_type !== "recovery" && Number(s.recovery_seconds) > 0) {
        phase = "recovery";
        remaining = Number(s.recovery_seconds) || 0;
        lastCountdownSpoken = null;
        playVoice("recovery", "Recupero");
        render();
        return;
      }
      if (phase === "recovery") {
        phase = "work";
      }
      if (phase === "roundRest") {
        phase = "work";
        stationIndex = 0;
        setInitialTime();
        lastCountdownSpoken = null;
        playVoice("next", "Cambio");
        setTimeout(announceStation, 900);
        render();
        return;
      }
      if (stationIndex < stations.length - 1) {
        stationIndex += 1;
        phase = "work";
        setInitialTime();
        lastCountdownSpoken = null;
        playVoice("next", "Cambio");
        setTimeout(announceStation, 900);
      } else if (round < circuit.rounds) {
        round += 1;
        if (Number(circuit.rest_between_rounds_seconds) > 0) {
          phase = "roundRest";
          remaining = Number(circuit.rest_between_rounds_seconds);
          lastCountdownSpoken = null;
          playVoice("roundEnd", "Fine giro");
        } else {
          stationIndex = 0;
          phase = "work";
          setInitialTime();
          lastCountdownSpoken = null;
          playVoice("start", "Via");
          setTimeout(announceStation, 900);
        }
      } else {
        pauseTimer();
        document.getElementById("stationType").textContent = "FINE";
        document.getElementById("exerciseName").textContent = "Circuito completato";
        document.getElementById("mainValue").textContent = "OK";
        playVoice("finish", "Fine circuito");
        return;
      }
      render();
    }

    function resetCircuit() {
      pauseTimer();
      stationIndex = 0;
      round = 1;
      phase = "work";
      setInitialTime();
      lastCountdownSpoken = null;
      render();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    async function loadCircuits() {
      const { data, error } = await client
        .from("functional_circuits")
        .select("id,title,description,rounds,rest_between_rounds_seconds,status")
        .eq("status", "published")
        .order("updated_at", { ascending: false });
      if (error) {
        document.getElementById("exerciseName").textContent = error.message;
        return;
      }
      circuits = data || [];
      document.getElementById("circuitSelect").innerHTML = circuits.map((c) => `<option value="${c.id}">${c.title}</option>`).join("");
      if (circuits[0]) selectCircuit(circuits[0].id);
      else render();
    }

    async function selectCircuit(id) {
      circuit = circuits.find((c) => c.id === id);
      const { data, error } = await client
        .from("functional_circuit_stations")
        .select("*")
        .eq("circuit_id", id)
        .order("sort_order", { ascending: true });
      if (error) {
        document.getElementById("exerciseName").textContent = error.message;
        return;
      }
      stations = data || [];
      resetCircuit();
    }

    updateClock();
    setInterval(updateClock, 1000);
    loadCircuits();
  </script>

<script>

 }catch(error){if(request===monitorTxtRequest){message.textContent='Impossibile leggere il file: '+(error.message||error);message.classList.add('error');}}
 finally{input.value='';}

<script>

 if(![cols,rows,x,y].every(Number.isInteger)||cols<1||rows<1||cols>16||rows>16||x<0||y<0||x>=cols||y>=rows)return null;
 const node=document.createElement('span');node.className='kleosTxtExerciseThumb';node.setAttribute('role','img');node.setAttribute('aria-label',name);node.title=name;
