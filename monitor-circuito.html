<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KleosFitCoach Pro - Monitor Circuito</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#020303; --panel:#101114; --line:#2a2d33; --text:#f7f8fb; --muted:#9ca3af; --lime:#a6ff00; --danger:#ff4d4d; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,Arial,sans-serif; overflow:hidden; }
    .screen { height:100vh; height:100dvh; display:grid; grid-template-rows:minmax(76px,9vh) minmax(0,1fr) auto; overflow:hidden; }
    header { min-height:0; padding:clamp(12px,1.7vh,22px) clamp(18px,2.2vw,32px); border-bottom:1px solid var(--line); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:clamp(12px,1.6vw,24px); background:#060707; }
    .brand { color:var(--lime); font-weight:1000; letter-spacing:.08em; font-size:clamp(18px,1.65vw,30px); white-space:nowrap; }
    .title { font-size:clamp(20px,1.9vw,34px); font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .status { color:var(--muted); font-weight:800; font-size:clamp(12px,.95vw,18px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .clock { color:var(--lime); font-size:clamp(42px,4.6vw,86px); line-height:.9; font-weight:1000; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:520px; text-align:right; overflow:hidden; }
    .stateBox { display:grid; justify-items:end; gap:2px; }
    .timeInfo { color:var(--muted); font-size:clamp(11px,.8vw,15px); font-weight:900; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .timeRows { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .timeRows div { display:grid; gap:3px; }
    .timeRows span { color:var(--muted); font-size:clamp(10px,.72vw,13px); font-weight:900; }
    .timeRows strong { color:var(--lime); font-size:clamp(24px,2.15vw,38px); line-height:1; font-variant-numeric:tabular-nums; }
    main { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,22vw); gap:clamp(14px,1.6vw,26px); padding:clamp(14px,2vh,28px); min-height:0; overflow:hidden; }
    .stage { border:1px solid rgba(166,255,0,.35); border-radius:8px; background:linear-gradient(180deg,#101114,#050606); padding:clamp(18px,2.3vw,38px); display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; min-height:0; overflow:hidden; }
    .kicker { color:var(--lime); font-size:clamp(16px,1.35vw,26px); font-weight:1000; letter-spacing:.08em; text-transform:uppercase; }
    .exercise { font-size:clamp(44px,7.1vw,130px); line-height:.92; font-weight:1000; margin:clamp(8px,1.2vh,18px) 0; word-break:break-word; overflow-wrap:anywhere; max-height:24vh; overflow:hidden; }
    .meta { color:var(--muted); font-size:clamp(18px,1.7vw,32px); font-weight:800; display:flex; gap:18px; flex-wrap:wrap; max-height:7vh; overflow:hidden; }
    .timer { align-self:center; font-size:clamp(96px,17vw,250px); line-height:.82; color:var(--lime); font-weight:1000; text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
    .reps { align-self:center; font-size:clamp(70px,11vw,180px); line-height:.9; color:var(--lime); font-weight:1000; text-align:center; white-space:nowrap; overflow:hidden; }
    .note { font-size:clamp(18px,1.75vw,32px); color:var(--text); font-weight:800; border-top:1px solid var(--line); padding-top:clamp(10px,1.4vh,18px); min-height:0; max-height:11vh; overflow:hidden; }
    .side { display:grid; gap:clamp(10px,1.3vh,16px); grid-template-rows:auto auto minmax(0,1fr); min-height:0; overflow:hidden; }
    .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:clamp(12px,1.4vw,20px); min-height:0; overflow:hidden; }
    .box h3 { margin:0 0 8px; color:var(--lime); font-size:clamp(13px,1vw,18px); text-transform:uppercase; letter-spacing:.08em; }
    .round { font-size:clamp(48px,4.6vw,82px); font-weight:1000; line-height:1; }
    .next { font-size:clamp(22px,2vw,36px); font-weight:900; line-height:1.05; overflow-wrap:anywhere; }
    .queue { overflow:auto; display:grid; gap:10px; padding-right:4px; }
    .station { border:1px solid var(--line); border-radius:8px; padding:clamp(8px,1vh,12px); background:#08090b; }
    .station.active { border-color:var(--lime); background:#132000; }
    .station .name { font-size:clamp(14px,1.05vw,19px); font-weight:900; line-height:1.1; }
    .station .sub { color:var(--muted); font-size:clamp(11px,.8vw,14px); margin-top:4px; }
    footer { min-height:clamp(74px,9vh,122px); padding:clamp(8px,1.2vh,16px) clamp(12px,1.6vw,24px); border-top:1px solid var(--line); display:flex; gap:clamp(7px,.7vw,11px); align-items:center; justify-content:center; align-content:center; flex-wrap:wrap; background:#060707; overflow:visible; }
    button { min-height:clamp(42px,4.8vh,54px); border:0; border-radius:8px; padding:7px clamp(10px,1vw,18px); font-size:clamp(12px,.9vw,16px); font-weight:1000; cursor:pointer; background:var(--lime); color:#071006; min-width:clamp(92px,7vw,134px); white-space:nowrap; }
    button.secondary { background:#101114; color:var(--text); border:1px solid var(--line); }
    button.danger { background:var(--danger); color:#fff; }
    select { min-height:clamp(42px,4.8vh,54px); border:1px solid var(--line); border-radius:8px; background:#101114; color:var(--text); padding:7px 12px; font-size:clamp(12px,.9vw,16px); font-weight:800; min-width:clamp(190px,16vw,300px); max-width:32vw; }
    .recovery .exercise, .recovery .timer, .recovery .reps { color:#ffffff; }
    .recovery .kicker { color:#ffffff; }
    @media (max-height:760px) and (min-width:1001px) {
      .screen { grid-template-rows:minmax(58px,8vh) minmax(0,1fr) auto; }
      .queue .station:nth-child(n+7) { display:none; }
      .exercise { max-height:20vh; }
      .note { max-height:8vh; }
    }
    @media (orientation: portrait) and (min-width:700px) {
      body { overflow:hidden; }
      .screen { height:100vh; height:100dvh; grid-template-rows:minmax(96px,9vh) minmax(0,1fr) auto; }
      header {
        grid-template-columns:1fr auto;
        grid-template-areas:
          "brand state"
          "title title";
        grid-template-columns:1fr auto;
        padding:22px 28px;
      }
      .brand { grid-area:brand; font-size:clamp(24px,3.8vw,42px); }
      header > div:nth-child(2) { grid-area:title; min-width:0; }
      .stateBox { grid-area:state; }
      #stateLabel { font-size:clamp(18px,2.5vw,28px); }
      .clock { font-size:clamp(38px,6vw,72px); min-width:420px; }
      .title { font-size:clamp(28px,4.4vw,54px); }
      .status { font-size:clamp(16px,2vw,24px); }
      main {
        grid-template-columns:1fr;
        grid-template-rows:minmax(0,1fr) minmax(260px,28vh);
        padding:22px;
        gap:18px;
      }
      .stage {
        padding:28px;
        grid-template-rows:auto minmax(0,1fr) auto;
      }
      .kicker { font-size:clamp(24px,3.2vw,40px); }
      .exercise {
        font-size:clamp(64px,9.6vw,120px);
        max-height:22vh;
        margin:16px 0 8px;
      }
      .meta { font-size:clamp(22px,3vw,34px); max-height:6vh; }
      .timer { font-size:clamp(170px,26vw,300px); }
      .reps { font-size:clamp(120px,18vw,230px); }
      .note { font-size:clamp(24px,3.4vw,42px); max-height:10vh; }
      .side {
        grid-template-columns:180px minmax(0,1fr);
        grid-template-rows:auto minmax(0,1fr);
        gap:14px;
      }
      .side .box:nth-child(1) { grid-column:1; grid-row:1 / span 3; }
      .side .box:nth-child(2) { grid-column:2; grid-row:1; }
      .side .box:nth-child(3) { grid-column:2; grid-row:2; }
      .side .box:nth-child(4) { grid-column:2; grid-row:3; }
      .round { font-size:clamp(68px,9vw,120px); }
      .next { font-size:clamp(28px,4vw,52px); }
      .queue {
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
      }
      .queue .station:nth-child(n+7) { display:none; }
      .station .name { font-size:clamp(18px,2.4vw,28px); }
      .station .sub { font-size:clamp(13px,1.8vw,20px); }
      footer { flex-wrap:wrap; align-content:center; padding:12px 20px; min-height:120px; overflow:visible; }
      select { width:100%; max-width:none; min-height:46px; }
      button { min-width:120px; min-height:46px; }
    }
    @media (max-width:1000px) {
      body { overflow:auto; }
      .screen { height:auto; min-height:100vh; overflow:visible; }
      header { grid-template-columns:1fr; }
      main { grid-template-columns:1fr; overflow:visible; }
      footer { flex-wrap:wrap; overflow:visible; }
      select { max-width:none; width:100%; }
    }
    @media (orientation: portrait) {
      body { overflow:hidden; }
      .screen {
        width:100vw;
        height:100vh;
        height:100dvh;
        min-height:0;
        overflow:hidden;
        grid-template-rows:96px minmax(0,1fr) auto;
      }
      header {
        grid-template-columns:1fr auto;
        grid-template-areas:"brand state" "title title";
        grid-template-columns:1fr auto;
        padding:14px 18px;
        gap:6px 12px;
        align-items:center;
      }
      .brand { grid-area:brand; font-size:22px; }
      header > div:nth-child(2) { grid-area:title; min-width:0; }
      .stateBox { grid-area:state; }
      #stateLabel { font-size:16px; }
      .clock { font-size:42px; min-width:320px; }
      .title { font-size:24px; }
      .status { font-size:14px; }
      main {
        grid-template-columns:1fr;
        grid-template-rows:minmax(0,1fr) minmax(360px,34vh);
        padding:12px;
        gap:10px;
        overflow:hidden;
      }
      .stage {
        min-height:0;
        padding:18px;
        grid-template-rows:auto minmax(0,1fr) auto;
      }
      .kicker { font-size:20px; }
      .exercise {
        font-size:clamp(44px,10vw,96px);
        max-height:20vh;
        margin:10px 0 4px;
      }
      .meta { font-size:clamp(16px,3vw,28px); max-height:5vh; }
      .timer { font-size:clamp(120px,28vw,260px); }
      .reps { font-size:clamp(86px,20vw,200px); }
      .note { font-size:clamp(18px,3.8vw,34px); max-height:8vh; padding-top:10px; }
      .side {
        grid-template-columns:128px minmax(0,1fr);
        grid-template-rows:92px 92px minmax(0,1fr);
        gap:8px;
        overflow:hidden;
      }
      .side .box:nth-child(1) { grid-column:1; grid-row:1 / span 2; }
      .side .box:nth-child(2) { grid-column:2; grid-row:1; }
      .side .box:nth-child(3) { grid-column:2; grid-row:2; }
      .box { padding:10px; }
      .box h3 { font-size:12px; margin-bottom:6px; }
      .round { font-size:54px; }
      .next { font-size:22px; }
      .queue {
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
        overflow-y:auto;
        overflow-x:hidden;
        -webkit-overflow-scrolling:touch;
        touch-action:pan-y;
      }
      .queue .station:nth-child(n+5) { display:block; }
      .station { padding:7px; }
      .station .name { font-size:15px; }
      .station .sub { font-size:11px; }
      footer {
        min-height:148px;
        height:auto;
        padding:8px 10px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:8px;
        overflow:visible;
      }
      select {
        grid-column:1 / -1;
        width:100%;
        max-width:none;
        min-width:0;
        min-height:42px;
        height:42px;
        font-size:14px;
      }
      button {
        min-width:0;
        min-height:42px;
        height:42px;
        padding:6px 8px;
        font-size:13px;
      }
    }
  </style>
<style>
#monitorTxtFile{font:inherit;color:var(--text);background:transparent;border:0;padding:0;min-width:0}
#monitorTxtFile::file-selector-button{appearance:none;min-height:clamp(42px,4.8vh,54px);border:0;border-radius:8px;padding:7px clamp(10px,1vw,18px);font-family:inherit;font-size:clamp(12px,.9vw,16px);font-weight:1000;cursor:pointer;background:var(--lime);color:#071006;min-width:clamp(92px,7vw,134px);margin-right:12px}
#monitorTxtFile::file-selector-button:hover{filter:brightness(1.08)}
#monitorTxtFile:focus-visible{outline:2px solid var(--lime);outline-offset:4px;border-radius:8px}
</style>
</head>

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

    function pickPreferredVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      const italianVoices = voices.filter((voice) => voice.lang?.toLowerCase().startsWith("it"));
      const femaleHints = ["elsa", "alice", "lucia", "paola", "federica", "google italiano", "microsoft elsa", "female", "woman", "donna"];
      preferredVoice =
        italianVoices.find((voice) => femaleHints.some((hint) => voice.name.toLowerCase().includes(hint))) ||
        italianVoices.find((voice) => voice.localService) ||
        italianVoices[0] ||
        voices.find((voice) => femaleHints.some((hint) => voice.name.toLowerCase().includes(hint))) ||
        voices[0] ||
        null;
      return preferredVoice;

    function speak(text) {

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "it-IT";
      utterance.voice = preferredVoice || pickPreferredVoice();
      utterance.rate = 0.88;
      utterance.pitch = 1.12;

    function playVoice(key, fallbackText = "") {

    }

    function announceStation() {

      if (!station || station.station_type === "recovery") return;
      const modeText = station.work_mode === "reps" ? `${station.reps} ripetizioni` : `${station.work_seconds || 0} secondi`;

      if (voiceEnabled) playVoice("start", "Voce attiva");

    function formatTime(seconds) {
      const safe = Math.max(0, Number(seconds) || 0);
      const min = String(Math.floor(safe / 60)).padStart(2, "0");
      const sec = String(safe % 60).padStart(2, "0");
      return `${min}:${sec}`;
    }

    function stationDuration(station) {
      if (!station) return 0;
      if (station.station_type === "recovery") {
        return Number(station.work_seconds) || 0;
      }
      if (station.work_mode === "reps") {
        const reps = Number(station.reps) || 0;
        const repSeconds = Number(station.rep_seconds) || 0;
        const between = Number(station.seconds_between_reps) || 0;
        return Math.max(0, reps * repSeconds + Math.max(0, reps - 1) * between) +
          (Number(station.recovery_seconds) || 0);
      }
      return (Number(station.work_seconds) || 0) +
        (Number(station.recovery_seconds) || 0);
    }

    function totalCircuitSeconds() {
      if (!circuit || !stations.length) return 0;
      const oneRound = stations.reduce((sum, station) => sum + stationDuration(station), 0);
      const roundRest = Number(circuit.rest_between_rounds_seconds) || 0;
      return oneRound * (Number(circuit.rounds) || 1) +
        roundRest * Math.max(0, (Number(circuit.rounds) || 1) - 1);
    }

    function remainingCircuitSeconds() {
      if (!circuit || !stations.length) return 0;

      const rounds = Number(circuit.rounds) || 1;
      const roundRest = Number(circuit.rest_between_rounds_seconds) || 0;
      let total = 0;

      if (phase === "roundRest") {
        total += Math.max(0, Number(remaining) || 0);
        for (let r = round + 1; r <= rounds; r++) {
          total += stations.reduce((sum, station) => sum + stationDuration(station), 0);
          if (r < rounds) total += roundRest;
        }
        return total;
      }

      const current = currentStation();

      if (phase === "recovery") {
        total += Math.max(0, Number(remaining) || 0);
      } else if (current) {
        if (current.station_type === "recovery") {
          total += Math.max(0, Number(remaining) || 0);
        } else if (current.work_mode === "time") {
          total += Math.max(0, Number(remaining) || 0);
          total += Number(current.recovery_seconds) || 0;
        } else {
          total += Number(current.recovery_seconds) || 0;
        }
      }

      for (let i = stationIndex + 1; i < stations.length; i++) {
        total += stationDuration(stations[i]);
      }

      if (round < rounds) {
        total += roundRest;
        const oneRound = stations.reduce((sum, station) => sum + stationDuration(station), 0);
        total += oneRound * Math.max(0, rounds - round - 1);
        total += roundRest * Math.max(0, rounds - round - 1);
      }

      return Math.max(0, total);
    }

    function renderCircuitTimes() {
      const total = totalCircuitSeconds();
      const remainingTotal = remainingCircuitSeconds();
      const totalEl = document.getElementById("totalCircuitTime");
      const remainingEl = document.getElementById("remainingCircuitTime");
      if (totalEl) totalEl.textContent = formatTime(total);
      if (remainingEl) remainingEl.textContent = formatTime(remainingTotal);
    }

    function currentStation() {

    function nextStationName() {

      if (phase === "recovery" || s?.station_type === "recovery") {
        const next = stations[stationIndex + 1];
        if (next) return next.exercise_name;
        if (round < circuit.rounds) return `Recupero giro ${circuit.rest_between_rounds_seconds}s`;
        return "Fine circuito";
      }

      // Durante l'esercizio, il recupero resta il prossimo passaggio.
      if (phase === "work" && s?.recovery_seconds > 0) {
        return `Recupero ${s.recovery_seconds}s`;

      if (next) return next.exercise_name;
      if (round < circuit.rounds) return `Recupero giro ${circuit.rest_between_rounds_seconds}s`;
      return "Fine circuito";

    function render() {
      const s = currentStation();
      const stage = document.getElementById("stage");
      stage.classList.toggle("recovery", s?.station_type === "recovery" || phase === "recovery" || phase === "roundRest");

      if (!s) {
        document.getElementById("stationType").textContent = "PRONTO";

        document.getElementById("mainValue").className = "timer";
        document.getElementById("mainValue").textContent = formatTime(remaining);

        document.getElementById("stationType").textContent = "RECUPERO TRA GIRI";

      } else {
        const isRecoveryStation = s.station_type === "recovery";

        document.getElementById("mainValue").textContent = s.work_mode === "reps" && !isRecoveryStation ? `${s.reps} REP` : formatTime(remaining);
        document.getElementById("stationNote").textContent = s.notes || (s.work_mode === "reps" ? "Premi AVANTI quando completato." : "");
      }

        <div class="station ${index === stationIndex && phase === "work" ? "active" : ""}">
          <div class="name">${index + 1}. ${item.exercise_name}</div>
          <div class="sub">${item.station_type === "recovery" ? "Recupero" : item.work_mode === "reps" ? `${item.reps} rep` : `${item.work_seconds || 0}s`} ${item.recovery_seconds ? `+ rec ${item.recovery_seconds}s` : ""}</div>
        </div>
      `).join("");

      // Scorre automaticamente l'elenco fino alla stazione corrente.
      const activeStation = queue.querySelector(".station.active");
      if (activeStation) {
        activeStation.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }

    function setInitialTime() {
      const s = currentStation();
      remaining = s?.work_mode === "time" || s?.station_type === "recovery" ? Number(s.work_seconds) || 0 : 0;
    }

    function startTimer() {
      if (!circuit || !stations.length) return;
      if (!currentStation()) return;
      if (remaining <= 0 && currentStation().work_mode === "time") setInitialTime();
      playVoice("start", "Via");
      setTimeout(announceStation, 900);
      running = true;
      clearInterval(timer);
      timer = setInterval(() => {
        const s = currentStation();
        if (!s) return;
        if (phase === "work" && s.work_mode === "reps" && s.station_type !== "recovery") {
          render();
          return;
        }
        remaining -= 1;
        if (remaining === 10 && lastCountdownSpoken !== "10") {
          playVoice("last10", "Ultimi dieci secondi");
          lastCountdownSpoken = "10";
        } else if (remaining > 0 && remaining <= 3 && lastCountdownSpoken !== String(remaining)) {
          playVoice(
            remaining === 3 ? "three" : remaining === 2 ? "two" : "one",
            remaining === 3 ? "Tre" : remaining === 2 ? "Due" : "Uno"
          );
          lastCountdownSpoken = String(remaining);
        }
        if (remaining <= 0) nextStep();
        render();
      }, 1000);
      render();
    }

    function pauseTimer() {
      running = false;
      clearInterval(timer);
      render();
    }

    function nextStep() {
      const s = currentStation();
      if (!s) return;
      if (phase === "work" && s.station_type !== "recovery" && Number(s.recovery_seconds) > 0) {
        phase = "recovery";
        remaining = Number(s.recovery_seconds) || 0;
        lastCountdownSpoken = null;
        playVoice("recovery", "Recupero");
        render();
        return;
      }
      if (phase === "recovery") {
        phase = "work";
      }
      if (phase === "roundRest") {
        phase = "work";
        stationIndex = 0;
        setInitialTime();
        lastCountdownSpoken = null;
        playVoice("next", "Cambio");
        setTimeout(announceStation, 900);
        render();
        return;
      }
      if (stationIndex < stations.length - 1) {
        stationIndex += 1;
        phase = "work";
        setInitialTime();
        lastCountdownSpoken = null;
        playVoice("next", "Cambio");
        setTimeout(announceStation, 900);
      } else if (round < circuit.rounds) {
        round += 1;
        if (Number(circuit.rest_between_rounds_seconds) > 0) {
          phase = "roundRest";
          remaining = Number(circuit.rest_between_rounds_seconds);
          lastCountdownSpoken = null;
          playVoice("roundEnd", "Fine giro");
        } else {
          stationIndex = 0;
          phase = "work";
          setInitialTime();
          lastCountdownSpoken = null;
          playVoice("start", "Via");
          setTimeout(announceStation, 900);
        }
      } else {
        pauseTimer();
        document.getElementById("stationType").textContent = "FINE";
        document.getElementById("exerciseName").textContent = "Circuito completato";
        document.getElementById("mainValue").textContent = "OK";
        playVoice("finish", "Fine circuito");
        return;
      }
      render();
    }

    function resetCircuit() {
      pauseTimer();
      stationIndex = 0;
      round = 1;
      phase = "work";
      setInitialTime();
      lastCountdownSpoken = null;
      render();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    async function loadCircuits() {
      const { data, error } = await client
        .from("functional_circuits")
        .select("id,title,description,rounds,rest_between_rounds_seconds,status")
        .eq("status", "published")
        .order("updated_at", { ascending: false });
      if (error) {
        document.getElementById("exerciseName").textContent = error.message;
        return;
      }
      circuits = data || [];
      document.getElementById("circuitSelect").innerHTML = circuits.map((c) => `<option value="${c.id}">${c.title}</option>`).join("");
      if (circuits[0]) selectCircuit(circuits[0].id);
      else render();
    }

    async function selectCircuit(id) {
      circuit = circuits.find((c) => c.id === id);
      const { data, error } = await client
        .from("functional_circuit_stations")
        .select("*")
        .eq("circuit_id", id)
        .order("sort_order", { ascending: true });
      if (error) {
        document.getElementById("exerciseName").textContent = error.message;
        return;
      }
      stations = data || [];
      window.kleosCircuitReset();
    }

    updateClock();
    setInterval(updateClock, 1000);
    window.kleosCircuitReset = resetCircuit;
    loadCircuits();

  for(let b=0;b<blocks;b++){
   const sets=Number(c[1+b*2]||0),label=c[2+b*2]||'',seconds=techSeconds(label);
   let rest=defaultRest;const rm=label.match(/(?:\+|\/)\s*(\d+)\s*(?:[″"']|s\b).*rec/i);if(rm)rest=Number(rm[1]);
   if(sets>0)work.push({block:b,sets:Math.min(999,sets),seconds,rest,label});
  }
  rows.push({name:c[0],index:rows.length,work});
 }
 const steps=[];
 for(let b=0;b<blocks;b++){
  const rounds=Math.max(0,...rows.map(r=>r.work.find(w=>w.block===b)?.sets||0));
  for(let r=1;r<=rounds;r++)for(const row of rows){const w=row.work.find(w=>w.block===b);if(w&&r<=w.sets)steps.push({...w,name:row.name,row:row.index,round:r,rounds,kind:'work'});}
 }
 const timeline=[];steps.forEach((s,i)=>{timeline.push(s);if(i<steps.length-1&&s.rest>0)timeline.push({...s,kind:'rest',seconds:s.rest});});
 return {title,rows,steps:timeline,total:timeline.reduce((t,s)=>t+s.seconds,0)};
}
// UI integration: existing circuit handlers remain available outside TXT mode.
const techState={plan:null,index:0,remaining:0,running:false,done:false,deadline:0,interval:null,images:null,lastRow:-1};
const techPane=document.getElementById('monitorTxtPane');
const techHero=document.createElement('section');techHero.className='techHero';techHero.setAttribute('aria-label','Esercizio e timer');
techHero.innerHTML='<div id="techPhoto" class="techHeroImage"><span class="techHeroPlaceholder">K</span></div><div><div id="techPhase" class="techKicker">MONITOR ALLENAMENTO</div><div id="techName" class="techHeroTitle">Carica la tua scheda</div><div id="techMeta" class="techHeroMeta">Immagini, tempi e recuperi in un solo monitor.</div><div class="techStats"><span id="techRound">GIRO <strong>—</strong></span><div id="techProgress" class="techProgress"></div><span>TOTALE <strong id="techTotal">00:00</strong></span><span>RIMANENTE <strong id="techRemaining">00:00</strong></span></div></div><div class="techTimer"><div id="techTimer" class="techTimerValue" role="timer">00:00</div><div id="techTimerLabel" class="techTimerLabel">PRONTO</div></div>';
techPane.insertBefore(techHero,document.getElementById('monitorTxtText'));
const techOriginal={start:startTimer,pause:pauseTimer,next:nextStep,reset:resetCircuit,toggle:toggleMonitorTxt,format:kleosFormatTxtView};
function techMode(){return !techPane.hidden&&techState.plan?.steps.length>0;}
function techTime(seconds){const n=Math.max(0,Math.ceil(seconds));return (n>=3600?String(Math.floor(n/3600)).padStart(2,'0')+':':'')+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function techStop(){clearInterval(techState.interval);techState.interval=null;techState.running=false;}
function techSay(text){if(typeof speak==='function')speak(text);}
function techPaint(){
 const t=techState,p=t.plan,s=p?.steps[t.index];if(!p)return;
 const put=(id,v)=>{document.getElementById(id).textContent=v;};
 put('techName',t.done?'Allenamento completato':s?.kind==='rest'?'Recupero':s?.name||'Nessun esercizio');
 put('techPhase',t.done?'COMPLETATO':s?.kind==='rest'?'RECUPERO':`ESERCIZIO ${(s?.row||0)+1} / ${p.rows.length}`);
 put('techMeta',t.done?'':s?.kind==='rest'?'Prossimo: '+(p.steps[t.index+1]?.name||'Fine'):s?.seconds?`Lavoro ${s.seconds}″ · Recupero ${s.rest}″`:'Ripetizioni: '+s?.label+' · Premi AVANTI al termine');
 put('techTimer',t.done?'✓':s?.seconds?techTime(t.remaining):s?.label||'00:00');
 put('techTimerLabel',t.done?'COMPLETATO':t.running?(s?.kind==='rest'?'RECUPERO':'LAVORO'):'PRONTO / PAUSA');
 put('techTotal',techTime(p.total));put('techRemaining',techTime(t.done?0:t.remaining+p.steps.slice(t.index+1).reduce((a,x)=>a+x.seconds,0)));
 const round=document.getElementById('techRound');round.replaceChildren();round.append('GIRO ');const strong=document.createElement('strong');strong.textContent=`${s?.round||1}/${s?.rounds||1}`;round.append(strong);
 const bars=document.getElementById('techProgress');bars.replaceChildren();for(let i=1;i<=Math.min(20,s?.rounds||1);i++){const bar=document.createElement('span');bar.className=i<(s?.round||1)?'done':i===(s?.round||1)?'current':'';bars.append(bar);}
 techHero.classList.toggle('recovery',s?.kind==='rest');
 const row=s?.row??-1;document.querySelectorAll('#monitorTxtText tr[data-tech-row]').forEach(el=>{const active=Number(el.dataset.techRow)===row&&!t.done;el.classList.toggle('techActive',active);el.setAttribute('aria-current',active?'step':'false');if(active&&row!==t.lastRow){if(row===0)document.getElementById('monitorTxtText').scrollTop=0;else el.scrollIntoView({block:'nearest',inline:'nearest'});}});
 if(row!==t.lastRow){const photo=document.getElementById('techPhoto');photo.replaceChildren();const image=kleosTxtImageNode(t.images,s?.name);if(image)photo.append(image);else{const k=document.createElement('span');k.className='techHeroPlaceholder';k.textContent='K';photo.append(k);}t.lastRow=row;}
 if(techMode()){put('stateLabel',t.done?'COMPLETATO':t.running?'LIVE':'PAUSA');put('circuitTitle',p.title);put('circuitDescription','Scheda digitale · '+p.rows.length+' esercizi');}
}
function techAdvance(automatic=false){
 const t=techState;if(!t.plan||t.done)return;
 if(t.index>=t.plan.steps.length-1){t.done=true;t.remaining=0;techStop();techSay('Allenamento completato');techPaint();return;}
 t.index++;const s=t.plan.steps[t.index];t.remaining=s.seconds;
 if(t.running)t.deadline=(automatic?t.deadline:Date.now())+s.seconds*1000;
 if(!automatic)techSay(s.kind==='rest'?'Recupero':s.name);
 techPaint();
}
function techTick(){
 const t=techState;if(!t.running)return;let guard=0;
 while(t.running&&!t.done&&t.plan.steps[t.index]?.seconds>0&&Date.now()>=t.deadline&&guard++<10000)techAdvance(true);
 if(!t.done&&t.plan.steps[t.index]?.seconds>0)t.remaining=Math.max(0,Math.ceil((t.deadline-Date.now())/1000));techPaint();
}
function techStart(){const t=techState;if(t.done)techReset();if(t.running)return;techOriginal.pause();t.running=true;t.deadline=Date.now()+t.remaining*1000;t.interval=setInterval(techTick,200);techSay(t.plan.steps[t.index].kind==='rest'?'Recupero':t.plan.steps[t.index].name);techPaint();}
function techPause(){if(techState.running)techTick();techStop();techPaint();}
function techReset(){techStop();techState.index=0;techState.done=false;techState.remaining=techState.plan?.steps[0]?.seconds||0;techState.lastRow=-1;techPaint();}
function techLoad(text){
 techStop();const plan=parseKleosWorkout(text);techState.plan=plan;techState.images=kleosTxtImageData(text);techReset();
 document.querySelectorAll('#monitorTxtText tbody tr').forEach((row,index)=>{row.dataset.techRow=index;row.tabIndex=0;const jump=()=>{const current=plan.steps[techState.index];let at=plan.steps.findIndex(s=>s.kind==='work'&&s.row===index&&s.round===(current?.round||1)&&s.block===(current?.block||0));if(at<0)at=plan.steps.findIndex(s=>s.kind==='work'&&s.row===index);if(at>=0){techState.index=at;techState.done=false;techState.remaining=plan.steps[at].seconds;techState.deadline=Date.now()+techState.remaining*1000;techPaint();}};row.onclick=jump;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jump();}};});techPaint();
}
kleosFormatTxtView=function(el,text){techOriginal.format(el,text);if(el.id==='monitorTxtText'){techOriginal.pause();techLoad(text);}};
startTimer=function(){return techMode()?techStart():techOriginal.start();};pauseTimer=function(){return techMode()?techPause():techOriginal.pause();};nextStep=function(){return techMode()?techAdvance():techOriginal.next();};resetCircuit=function(){return techMode()?techReset():techOriginal.reset();};
toggleMonitorTxt=function(){if(!techPane.hidden)techPause();else techOriginal.pause();techOriginal.toggle();if(techMode())techPaint();};
fitSheet=function(el){if(!el)return;el.style.setProperty('--sheet-zoom',String(monitorTxtZoom));el.style.overflowX='hidden';el.style.overflowY='auto';};
document.addEventListener('visibilitychange',()=>{if(techState.running)techTick();});

document.getElementById('circuitSelect').addEventListener('change',()=>{if(!techPane.hidden){techPause();techOriginal.toggle();}});

</script>
